<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page_title }} :: {{ site_name }}</title>
</head>
<body data-template="custom" data-kind="{{ content_kind }}" data-url="{{ url_path }}">
  <aside>{{ page_description }}</aside>
  <nav class="template-nav">{{ navigation_html }}</nav>
  <div class="template-section" data-section-title="{{ current_section_title }}" data-section-url="{{ current_section_url }}" data-page-header-title="{{ page_header_title }}">{{ page_header_html }}</div>
  <section data-site="{{ site_url }}">{{ body_html }}</section>
</body>
</html>
