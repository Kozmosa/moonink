<!doctype html>
<html data-theme-v2="default" data-layout-kind="{{ page.layout }}">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ site.theme_asset_root }}moonink-default.css">
    <link rel="stylesheet" href="{{ site.theme_asset_root }}theme-vars.css">
    {{ slots.head }}
  </head>
  <body class="{{ page.body_class }}" data-kind="{{ page.kind }}" data-url="{{ page.url_path }}" data-theme="{{ site.theme_name }}">
    {% include "header" %}
    <div class="site-shell" data-content-layout="{{ page.layout }}">
      {% include "sidebar" %}
      <div class="content-shell content-shell-archive">
        <div class="content-shell-inner">
          <header class="content-header content-header-archive" data-content-layout="{{ page.layout }}">
            <p class="content-kind-label">Archive</p>
            <h1 class="content-title">{{ page.title }}</h1>
            {% if page.summary %}<p class="article-summary">{{ page.summary }}</p>{% endif %}
            <div class="surface-links">
              <a href="{{ site.search_url }}">Search</a>
              <a href="{{ site.tags_url }}">Tags</a>
              <a href="{{ site.series_url }}">Series</a>
            </div>
          </header>
          <main class="surface-body" data-source="{{ page.source_path }}">{{ page.body_html }}</main>
        </div>
      </div>
    </div>
    {{ slots.scripts }}
  </body>
</html>
