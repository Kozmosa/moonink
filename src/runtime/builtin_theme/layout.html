<!doctype html>
<html data-theme="default">
  <head>
    <meta charset="utf-8">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ theme_asset_root }}moonink-default.css">
  </head>
  <body class="{{ page_body_class }}" data-kind="{{ content_kind }}" data-url="{{ url_path }}" data-theme="{{ theme_name }}">
    <header class="site-header">
      <a href="{{ site_url }}">{{ site_name }}</a>
    </header>
    <div class="site-shell" data-content-layout="{{ content_kind }}">
      <aside class="site-nav">{{ navigation_html }}</aside>
      <div class="content-shell">
        <header class="content-header" data-content-layout="{{ content_kind }}">
          <p class="content-kind-label">{{ content_kind }}</p>
          <h1 class="content-title">{{ page_header_title }}</h1>
          <div class="content-context" data-section-title="{{ current_section_title }}" data-section-url="{{ current_section_url }}">{{ page_header_html }}</div>
        </header>
        <main data-source="{{ source_path }}">{{ body_html }}</main>
      </div>
    </div>
  </body>
</html>
